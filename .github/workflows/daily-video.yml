name: Daily video

on:
  schedule:
    - cron: "17 17 * * *" # 01:17 Taiwan time; videos go public at 08:00 and 20:00
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-video

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DRIVE_LIBRARY_FOLDER: ${{ vars.DRIVE_LIBRARY_FOLDER || 'YT Music Library' }}
      DRIVE_OUTPUT_FOLDER: ${{ vars.DRIVE_OUTPUT_FOLDER || 'YT Music Output' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk rclone
          pip install -r requirements.txt

      - name: Configure rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Download music library
        run: rclone copy "gdrive:$DRIVE_LIBRARY_FOLDER" music --transfers 8

      # Report-only: lists songs whose later part gains a clashing second chord layer.
      - name: Check music library for clashing layers
        continue-on-error: true
        run: |
          python scripts/check_audio.py music | tee audio_check.txt
          { echo '### Audio check'; echo '```'; cat audio_check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Make video
        run: python scripts/make_video.py

      - name: Upload to Google Drive
        run: rclone copy output "gdrive:$DRIVE_OUTPUT_FOLDER" --exclude "work/**"

      # Keep the last 3 days (today + 2); 60h catches the file made 3 days ago even if
      # today's run starts a little early. Skip the trash so the space is freed right away.
      - name: Delete outputs older than 3 days
        run: rclone delete "gdrive:$DRIVE_OUTPUT_FOLDER" --min-age 60h --drive-use-trash=false

      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "Daily video $(TZ=Asia/Taipei date +%F)"
          git push
